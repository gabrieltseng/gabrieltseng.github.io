---
layout: main
title: Home
---
<div class="columns is-variable">
  <div class="columns">
    <div class="column is-one-quarter content" style="vertical-align: top">
      <figure class="image">
        <img src="/assets/img/profile.jpg">
      </figure>
    </div>
    <div class="column is-three-quarters content">
      <h1>{{ site.title }}</h1>
      {% capture description %}{% include description.md %}{% endcapture %}
      {{ description | markdownify }}

      <h2>News</h2>
      {% assign news = site.news | sort: 'date' | reverse %}
      {% for item in news limit:10 %}
        {% include news-item.html %}
      {% endfor %}
    </div>
  </div>
</div>
